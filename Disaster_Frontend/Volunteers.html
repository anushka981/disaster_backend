<!DOCTYPE html>
<html>

<head>
<title>All Volunteers</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark shadow">
<div class="container d-flex justify-content-between">

<a class="navbar-brand fw-bold">All Volunteers</a>

<div>
<a href="admin.html" class="btn btn-light">Back to Dashboard</a>
</div>

</div>
</nav>

<div class="container mt-4">

<h2 class="text-center fw-bold mb-4">Active Volunteers</h2>

<div class="table-responsive">
<table class="table table-bordered text-center align-middle">

<thead class="table-success">
<tr>
<th>Username</th>
<th>Role</th>
<th>Assigned Reports</th>
</tr>
</thead>

<tbody id="volunteerTable">
</tbody>

</table>
</div>

</div>

<script>

function authHeaders() {
    return { "Authorization": "Bearer " + localStorage.getItem("token") };
}

let role = localStorage.getItem("role");
if (role !== "coordinator") {
    alert("Access Denied!");
    window.location.href = "login.html";
}

document.addEventListener("DOMContentLoaded", function () {
    fetchAllVolunteers();
});

function fetchAllVolunteers() {

    fetch("http://localhost:8080/volunteers", {
        headers: authHeaders()
    })
    .then(res => res.json())
    .then(volunteers => {

        fetch("http://localhost:8080/reports", {
            headers: authHeaders()
        })
        .then(res => res.json())
        .then(reports => {

            let table = document.getElementById("volunteerTable");
            table.innerHTML = "";

            if (volunteers.length === 0) {
                table.innerHTML = `<tr><td colspan="3">No volunteers yet.</td></tr>`;
                return;
            }

            volunteers.forEach(v => {

                const assignedCount = reports.filter(r => r.volunteer === v.username).length;

                table.innerHTML += `
                    <tr>
                        <td>${v.username}</td>
                        <td>${v.role}</td>
                        <td>${assignedCount}</td>
                    </tr>
                `;

            });

        });

    })
    .catch(error => {
        console.error("Error:", error);
        alert("Could not load volunteers.");
    });

}

</script>

</body>
</html>
