<!DOCTYPE html>
<html>

<head>
<title>Admin Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark shadow">
<div class="container d-flex justify-content-between">

<a class="navbar-brand fw-bold">Admin Dashboard</a>

<div>
<span id="userWelcome" class="text-white me-3"></span>

<a href="index.html" class="btn btn-light">Home</a>

<button onclick="logout()" class="btn btn-danger ms-2">
Logout
</button>

</div>

</div>
</nav>


<div class="container mt-4">

<h2 class="text-center fw-bold">
System Overview
</h2>


<div class="row text-center g-4 mt-3">

<div class="col-md-4">
<div class="card p-4">

<h5>Total Disasters</h5>

<h2 id="totalReports" class="text-danger">
0
</h2>

</div>
</div>


<div class="col-md-4">
<div class="card p-4">

<h5>Help Requests</h5>

<h2 id="totalHelp" class="text-primary">
0
</h2>

</div>
</div>


<div class="col-md-4">
<div class="card p-4">

<h5>Active Volunteers</h5>

<h2 class="text-success">
18
</h2>

</div>
</div>


</div>

</div>



<!-- Disaster Reports -->

<div class="container mt-5">

<h3 class="text-center fw-bold">
Disaster Reports
</h3>


<table class="table table-bordered text-center">

<thead class="table-dark">

<tr>

<th>Type</th>
<th>Location</th>
<th>Description</th>
<th>Status</th>
<th>Volunteer</th>
<th>Action</th>

</tr>

</thead>


<tbody id="reportTable">

</tbody>


</table>


</div>




<!-- Help Requests -->

<div class="container mt-5">

<h3 class="text-center fw-bold">
Help Requests
</h3>


<table class="table table-bordered text-center">

<thead class="table-primary">

<tr>

<th>Help Type</th>
<th>Location</th>
<th>Description</th>

</tr>

</thead>


<tbody id="helpTable">

</tbody>


</table>

</div>





<script>


document.addEventListener("DOMContentLoaded",function(){

fetchReports();

fetchHelpRequests();


});




// Disaster Reports

function fetchReports(){


fetch("http://localhost:8080/reports")


.then(res=>res.json())


.then(data=>{


let table=document.getElementById("reportTable");


table.innerHTML="";


document.getElementById("totalReports").innerText=data.length;



data.forEach(report=>{


table.innerHTML += `


<tr>


<td>${report.disasterType}</td>


<td>${report.location}</td>


<td>${report.description}</td>


<td>

<span class="badge bg-secondary">

${report.status}

</span>

</td>


<td>

${report.volunteer || "Not Assigned"}


<br>


<select id="volunteer${report.id}" class="form-select mt-2">

<option value="">Select</option>

<option>Rahul</option>

<option>Aman</option>

<option>Priya</option>

</select>


<button class="btn btn-success btn-sm mt-2"
onclick="assignVolunteer('${report.id}')">

Assign

</button>


</td>


<td>


<button class="btn btn-warning btn-sm"
onclick="updateStatus('${report.id}','In Progress')">

In Progress

</button>


<button class="btn btn-success btn-sm mt-2"
onclick="updateStatus('${report.id}','Resolved')">

Resolved

</button>


</td>


</tr>


`;

});


});


}




// Help Requests


function fetchHelpRequests(){


fetch("http://localhost:8080/help")


.then(res=>res.json())


.then(data=>{


let table=document.getElementById("helpTable");


table.innerHTML="";


document.getElementById("totalHelp").innerText=data.length;



data.forEach(help=>{


table.innerHTML += `


<tr>

<td>${help.helpType}</td>

<td>${help.location}</td>

<td>${help.description}</td>


</tr>


`;


});


});


}




// Update Status


function updateStatus(id,status){


fetch(`http://localhost:8080/report/${id}/status/${status}`,{

method:"PUT"

})


.then(res=>res.text())


.then(msg=>{


alert(msg);

fetchReports();


});


}




// Assign Volunteer


function assignVolunteer(id){


let name=document.getElementById("volunteer"+id).value;


fetch(`http://localhost:8080/report/${id}/volunteer/${name}`,{

method:"PUT"

})


.then(res=>res.text())


.then(msg=>{


alert(msg);

fetchReports();


});


}




// Login


let role=localStorage.getItem("role");


if(role!=="admin"){

alert("Access Denied!");

window.location.href="login.html";

}



let user=localStorage.getItem("username");


if(user){

document.getElementById("userWelcome").innerText="Welcome, "+user;

}




function logout(){

localStorage.removeItem("role");

localStorage.removeItem("username");


window.location.href="login.html";


}



</script>


</body>

</html>
