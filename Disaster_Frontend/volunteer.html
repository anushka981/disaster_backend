<!DOCTYPE html>
<html>

<head>
<title>Volunteer Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body>


<!-- Navbar -->

<nav class="navbar navbar-dark bg-danger shadow">

<div class="container d-flex justify-content-between">

<a class="navbar-brand fw-bold">
Volunteer Dashboard
</a>


<div>

<span id="userWelcome" class="text-white me-3"></span>

<a href="index.html" class="btn btn-light">
Home
</a>

<button onclick="logout()" class="btn btn-dark ms-2">
Logout
</button>


</div>

</div>

</nav>




<!-- Reports -->

<div class="container mt-5 fade-in">


<h2 class="text-center mb-4 fw-bold text-danger">
Assigned Disaster Reports
</h2>



<div class="table-responsive">


<table class="table table-bordered text-center align-middle">


<thead class="table-danger">

<tr>

<th>Disaster Type</th>
<th>Location</th>
<th>Description</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>



<tbody id="volunteerTable">


</tbody>



</table>


</div>


</div>





<script>


function authHeaders(extra) {
    return Object.assign(
        { "Authorization": "Bearer " + localStorage.getItem("token") },
        extra || {}
    );
}


document.addEventListener("DOMContentLoaded",function(){

fetchAssignedReports();

});





function fetchAssignedReports(){
let username = localStorage.getItem("username");

fetch("http://localhost:8080/reports", {
    headers: authHeaders()
})


.then(response=>response.json())


.then(data=>{


let table=document.getElementById("volunteerTable");


table.innerHTML="";



data.forEach(report=>{


// only assigned reports

if(report.volunteer == username){


table.innerHTML += `


<tr>


<td>
${report.disasterType}
</td>


<td>
${report.location}
</td>


<td>
${report.description}
</td>



<td>

<span class="badge bg-secondary">

${report.status}

</span>

</td>



<td>


<button class="btn btn-warning btn-sm"

onclick="updateTask('${report.id}','IN_PROGRESS')">

Start

</button>



<button class="btn btn-success btn-sm mt-2"

onclick="updateTask('${report.id}','RESOLVED')">

Complete

</button>


</td>



</tr>


`;


}


});



})

.catch(error=>{

console.log("Error:",error);

});


}







function updateTask(id,status){


fetch(`http://localhost:8080/report/${id}/status/${status}`,{


method:"PUT",
headers: authHeaders()


})


.then(async response => {

    const data = await response.json();

    if (!response.ok) {
        alert(data.error || "Could not update status");
        return;
    }

    alert("Status updated to " + data.status);
    fetchAssignedReports();

});


}


let role = localStorage.getItem("role");

if (role !== "volunteer") {
    alert("Access Denied!");
    window.location.href = "login.html";
}

let user = localStorage.getItem("username");

if (user) {
    document.getElementById("userWelcome").innerText = "Welcome, " + user;
}

function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("role");
    localStorage.removeItem("username");
    window.location.href = "login.html";
}

</script>
</body>

</html>
