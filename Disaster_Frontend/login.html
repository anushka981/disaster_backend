<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body class="bg-light">

<div class="container mt-5">
<div class="col-md-4 mx-auto">

<div class="card p-4 shadow">

<h3 class="text-center mb-3">Login</h3>

<form onsubmit="loginUser(event)">

<select id="role" class="form-select mb-3" required>
<option value="">Select Role</option>
<option value="coordinator">Coordinator</option>
<option value="volunteer">Volunteer</option>
</select>

<input
type="text"
id="username"
class="form-control mb-3"
placeholder="Username"
required>

<input
type="password"
id="password"
class="form-control mb-3"
placeholder="Password"
required>

<button id="loginBtn" class="btn btn-primary w-100">
Login
</button>

</form>

</div>
</div>
</div>

<script>

async function loginUser(e){

    e.preventDefault();

    const btn = document.getElementById("loginBtn");

    btn.disabled = true;
    btn.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Logging in...`;

    const selectedRole = document.getElementById("role").value;
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    try{

        const response = await fetch("http://localhost:8080/login",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                username:username,
                password:password
            })

        });

        const data = await response.json();

        btn.disabled = false;
        btn.innerHTML = "Login";

        if(response.ok && data.role === selectedRole){

            localStorage.setItem("token", data.token);
            localStorage.setItem("role", data.role);
            localStorage.setItem("username", data.username);

            Swal.fire({
                icon:"success",
                title:"Login Successful",
                text:"Welcome " + username,
                timer:1500,
                showConfirmButton:false
            }).then(()=>{

                if(data.role === "coordinator"){
                    window.location.href = "admin.html";
                }else{
                    window.location.href = "volunteer.html";
                }

            });

        }else{

            Swal.fire({
                icon:"error",
                title:"Login Failed",
                text: data.error || "Selected role does not match this account"
            });

        }

    }catch(error){

        btn.disabled = false;
        btn.innerHTML = "Login";

        Swal.fire({
            icon:"error",
            title:"Server Error",
            text:"Server not connected!"
        });

    }

}

</script>

</body>
</html>
