<!DOCTYPE html>
<html>

<head>
<title>Admin Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<nav class="navbar navbar-dark bg-dark shadow">
<div class="container d-flex justify-content-between">

<a class="navbar-brand fw-bold">Admin Dashboard</a>

<div>
<span id="userWelcome" class="text-white me-3"></span>

<a href="index.html" class="btn btn-light">Home</a>
<a href="map.html" class="btn btn-primary">
🗺 View Live Map
</a>

<button onclick="logout()" class="btn btn-danger ms-2">
Logout
</button>

</div>

</div>
</nav>


<div class="container mt-4">

<h2 class="text-center fw-bold">
System Overview
</h2>


<div class="row text-center g-4 mt-3">

<div class="col-md-4">
<div class="card p-4" style="cursor:pointer" onclick="window.location.href='disasters.html'">

<h5>Total Disasters</h5>

<h2 id="totalReports" class="text-danger">
0
</h2>

</div>
</div>

<div class="col-md-4">
<div class="card p-4" style="cursor:pointer" onclick="window.location.href='help_requests.html'">

<h5>Help Requests</h5>

<h2 id="totalHelp" class="text-primary">
0
</h2>

</div>
</div>


<div class="col-md-4">
<div class="card p-4" style="cursor:pointer" onclick="window.location.href='volunteers.html'">

<h5>Active Volunteers</h5>

<h2 id="totalVolunteers" class="text-success">
0
</h2>
</div>
</div>


</div>

</div>
<div class="container mt-5">

    <h3 class="text-center fw-bold mb-4">
        Disaster Analytics
    </h3>

    <div class="row">

        <div class="col-md-6">
            <div class="card p-3 shadow">
                <canvas id="statusChart"></canvas>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card p-3 shadow">
                <canvas id="typeChart"></canvas>
            </div>
        </div>

    </div>

</div>



<!-- Disaster Reports -->

<div class="container mt-5" id="reportsSection">

<h3 class="text-center fw-bold">
Disaster Reports
</h3>


<table class="table table-bordered text-center">

<thead class="table-dark">

<tr>

<th>Type</th>
<th>Location</th>
<th>Description</th>
<th>Status</th>
<th>Volunteer</th>
<th>Action</th>

</tr>

</thead>


<tbody id="reportTable">

</tbody>


</table>


</div>




<!-- Help Requests -->

<div class="container mt-5" id="helpSection">

<h3 class="text-center fw-bold">
Help Requests
</h3>


<table class="table table-bordered text-center">

<thead class="table-primary">

<tr>

<th>Help Type</th>
<th>Location</th>
<th>Description</th>

</tr>

</thead>


<tbody id="helpTable">

</tbody>


</table>

</div>




<!-- Volunteers -->

<div class="container mt-5" id="volunteersSection">

<h3 class="text-center fw-bold">
Active Volunteers
</h3>

<table class="table table-bordered text-center">

<thead class="table-success">
<tr>
<th>Username</th>
<th>Role</th>
</tr>
</thead>

<tbody id="volunteerListTable">

</tbody>

</table>

</div>





<script>

let statusChart;
let typeChart;
// ===============================
// AUTH HELPERS
// ===============================

function authHeaders(extra) {
    const headers = Object.assign(
        { "Authorization": "Bearer " + localStorage.getItem("token") },
        extra || {}
    );
    return headers;
}


document.addEventListener("DOMContentLoaded", function () {

    fetchVolunteers();
    fetchHelpRequests();

});




// Disaster Reports

function fetchReports(){

window.volunteers = window.volunteers || [];

fetch("http://localhost:8080/reports", {
    headers: authHeaders()
})


.then(res=>res.json())


.then(data=>{


let table=document.getElementById("reportTable");


table.innerHTML="";


document.getElementById("totalReports").innerText=data.length;

loadCharts(data);

data.forEach(report=>{


table.innerHTML += `


<tr>


<td>${report.disasterType}</td>


<td>${report.location}</td>


<td>${report.description}</td>


<td>

<span class="badge bg-secondary">

${report.status}

</span>

</td>


<td>

${report.volunteer || "Not Assigned"}


<br>

<select id="volunteer${report.id}" class="form-select mt-2">
${window.volunteers.map(v =>
`<option value="${v.username}">${v.username}</option>`
).join("")}
</select>

<button class="btn btn-success btn-sm mt-2"
onclick="assignVolunteer('${report.id}')">
Assign
</button>


</td>


<td>


<button class="btn btn-warning btn-sm"
onclick="updateStatus('${report.id}','IN_PROGRESS')">

In Progress

</button>


<button class="btn btn-success btn-sm mt-2"
onclick="updateStatus('${report.id}','RESOLVED')">

Resolved

</button>


</td>


</tr>


`;

});


});


}




// Help Requests


function fetchHelpRequests(){


fetch("http://localhost:8080/help", {
    headers: authHeaders()
})


.then(res=>res.json())


.then(data=>{


let table=document.getElementById("helpTable");


table.innerHTML="";


document.getElementById("totalHelp").innerText=data.length;



data.forEach(help=>{


table.innerHTML += `


<tr>

<td>${help.helpType}</td>

<td>${help.location}</td>

<td>${help.description}</td>


</tr>


`;


});


});


}




// Update Status


function updateStatus(id,status){


fetch(`http://localhost:8080/report/${id}/status/${status}`,{

method:"PUT",
headers: authHeaders()

})


.then(async res => {

    const data = await res.json();

    if (!res.ok) {
        alert(data.error || "Could not update status");
        return;
    }

    alert("Status updated to " + data.status);
    fetchReports();

});


}




// Assign Volunteer


function assignVolunteer(id){


let name=document.getElementById("volunteer"+id).value;


fetch(`http://localhost:8080/report/${id}/volunteer/${name}`,{

method:"PUT",
headers: authHeaders()

})


.then(async res => {

    const data = await res.json();

    if (!res.ok) {
        alert(data.error || "Could not assign volunteer");
        return;
    }

    alert("Volunteer assigned: " + data.volunteer);
    fetchReports();

});


}




// Login

let role = localStorage.getItem("role");

if (role !== "coordinator") {
    alert("Access Denied!");
    window.location.href = "login.html";
}

let user = localStorage.getItem("username");

if (user) {
    document.getElementById("userWelcome").innerText = "Welcome, " + user;
}

function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("role");
    localStorage.removeItem("username");
    window.location.href = "login.html";
}

function fetchVolunteers() {

    fetch("http://localhost:8080/volunteers", {
        headers: authHeaders()
    })
    .then(res => res.json())
    .then(data => {

        window.volunteers = data;

        document.getElementById("totalVolunteers").innerText = data.length;

        let table = document.getElementById("volunteerListTable");
        table.innerHTML = "";

        data.forEach(v => {
            table.innerHTML += `
                <tr>
                    <td>${v.username}</td>
                    <td>${v.role}</td>
                </tr>
            `;
        });

        fetchReports();

    });

}
function loadCharts(reports){

    let pending=0;
    let progress=0;
    let resolved=0;

    let types={};

    reports.forEach(r=>{

        if(r.status==="PENDING")
            pending++;

        else if(r.status==="IN_PROGRESS")
            progress++;

        else if(r.status==="RESOLVED")
            resolved++;

        types[r.disasterType]=(types[r.disasterType]||0)+1;

    });

    if(statusChart)
        statusChart.destroy();

    statusChart=new Chart(document.getElementById("statusChart"),{

        type:"pie",

        data:{
            labels:["Pending","In Progress","Resolved"],

            datasets:[{
                data:[pending,progress,resolved],
                backgroundColor:[
                    "#ffc107",
                    "#0d6efd",
                    "#198754"
                ]
            }]
        }

    });


    if(typeChart)
        typeChart.destroy();

    typeChart=new Chart(document.getElementById("typeChart"),{

        type:"bar",

        data:{
            labels:Object.keys(types),

            datasets:[{
                label:"Reports",
                data:Object.values(types),
                backgroundColor:"#dc3545"
            }]
        },

        options:{
            responsive:true
        }

    });

}
</script>




</body>

</html>
