spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/disasterdb}
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.upload.directory=${UPLOAD_DIRECTORY:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Optional first coordinator. Set both environment variables before startup.
app.bootstrap.coordinator.username=${BOOTSTRAP_COORDINATOR_USERNAME:}
app.bootstrap.coordinator.password=${BOOTSTRAP_COORDINATOR_PASSWORD:}
